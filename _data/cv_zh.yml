- title: 工作经历
  type: time_table
  contents:
    - title: 教授
      institution: 中山大学大气科学学院
      year: 2019-至今
      description:
        - 我的研究专注于地球表面过程的建模和理解，重点关注陆面相互作用、海岸水动力学和稳定同位素的应用。我利用数值模型和同位素示踪剂来研究陆地-大气相互作用，模拟海岸过程，并获得对环境动力学的深入见解。
    - title: 合作研究员
      institution: 东京大学生产技术研究所
      year: 2020-至今
      description:
        - 我的研究通过多学科视角探索地球系统动力学，结合气象学、水文学、数据同化和稳定同位素技术。我研究大气过程、陆地-大气相互作用，并利用观测数据和同位素示踪剂来改善我们对地球气候和水循环的理解和预测。
    - title: 科学助理
      institution: 苏黎世联邦理工学院，瑞士苏黎世
      year: 2019-2019
      description:
        - 导师：Professor Dani Or
        - 我研究了通过添加物理约束和土壤结构信息来改善土壤水力参数（水分保持和水力传导率）估算是否能提高陆面模型性能。
    - title: 项目研究员
      institution: 东京大学，日本东京
      year: 2018-2019
      description:
        - 导师：Professor Kei Yoshimura and Professor Koji Ikeuchi
        - 我探索了由于降水引起的河流路径的不确定性，并研究了大坝运行的影响。
    - title: 博士后研究员
      institution: 耶鲁大学，美国康涅狄格州
      year: 2016-2018
      description:
        - 导师：Professor Xuhui Lee
        - 我开发了一个同位素耦合的大涡模拟模型。这涉及将同位素示踪剂整合到大气模拟中，以增强对大气过程和传输的理解。

